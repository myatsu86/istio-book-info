name: Build app

# Reusable workflow: builds one app's image and pushes it outside of pull requests.
on:
  workflow_call:
    inputs:
      app:
        description: Directory of the app (also the Docker build context)
        required: true
        type: string
      image:
        description: Docker Hub image name, e.g. myatsumon/rating-app
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image tag
        run: echo "TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: docker build -f "${{ inputs.app }}/Dockerfile.scratch" -t "${{ inputs.image }}:$TAG" "${{ inputs.app }}"

      # Scan before pushing so a vulnerable image never reaches the registry.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ inputs.image }}:${{ env.TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: docker push "${{ inputs.image }}:$TAG"
