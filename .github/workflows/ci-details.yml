name: CI details

on:
  push:
    paths:
      - 'details/**'
      - '.github/workflows/ci-details.yml'
      - '.github/workflows/build-app.yml'
  pull_request:
    paths:
      - 'details/**'
      - '.github/workflows/ci-details.yml'
      - '.github/workflows/build-app.yml'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-app.yml
    with:
      app: details
      image: myatsumon/details-app
    secrets: inherit
