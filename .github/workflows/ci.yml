name: CI

# Main pipeline: builds every app. Per-app pipelines (ci-<app>.yml) run on their own path changes.
on:
  workflow_dispatch:

jobs:
  details:
    uses: ./.github/workflows/build-app.yml
    with:
      app: details
      image: myatsumon/details-app
    secrets: inherit

  productpage:
    uses: ./.github/workflows/build-app.yml
    with:
      app: productpage
      image: myatsumon/productpage-app
    secrets: inherit

  rating:
    uses: ./.github/workflows/build-app.yml
    with:
      app: rating
      image: myatsumon/rating-app
    secrets: inherit

  reviews:
    uses: ./.github/workflows/build-app.yml
    with:
      app: reviews
      image: myatsumon/reviews-app
    secrets: inherit
